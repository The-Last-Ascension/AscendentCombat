# ============================================================================
# AscendentCombat v1.0.0 - Configuración del Sistema de Combate (Grounded 2 + RPG)
# ============================================================================

parry-and-block:
  # Ventana de Parry perfecto tras pulsar Clic Derecho (en milisegundos)
  parry-window-ms: 260
  # Duración de la guardia/bloqueo activo por cada clic derecho mantenido (ms)
  block-active-ms: 1100
  # Cooldown mínimo tras fallar un intento de parry (ms)
  parry-cooldown-ms: 450
  # Porcentaje de mitigación de daño base al bloquear (0.60 = 60% menos daño)
  default-block-mitigation: 0.60
  # Cantidad de Stun aplicada al enemigo al lograr un Parry perfecto
  enemy-stun-on-parry: 45.0
  # Cantidad de Stun que sube al propio jugador al bloquear un ataque normal
  self-stun-on-block: 22.0
  # Cantidad de Stun que sube al propio jugador al bloquear un ataque NO parreable
  self-stun-on-unparryable: 38.0

stun:
  # Umbral máximo de Stun de enemigos normales (los jefes escalan según su vida)
  default-enemy-max-stun: 100.0
  # Segundos que dura el estado de Stun (Aturdido) en enemigos y jugadores
  enemy-stun-duration-seconds: 4
  player-stun-duration-seconds: 3
  # Recuperación pasiva de postura/Stun por segundo fuera de guardia
  decay-per-second: 8.0

elements:
  # Duración (segundos) que un enemigo permanece impregnado por un elemento (Tipo 1)
  impregnation-duration-seconds: 8
  # Multiplicador de daño base al detonar una Reacción de Impregnación (Tipo 1)
  impregnation-reaction-damage-bonus: 8.0
  # Stun extra al detonar una Reacción de Impregnación
  impregnation-reaction-stun-bonus: 25.0
  # Ventana (segundos) y radio (bloques) para combinar Definitivas/Skills entre amigos (Tipo 2)
  coop-synergy-window-seconds: 4
  coop-synergy-radius-blocks: 12.0
  coop-synergy-damage: 24.0
  coop-synergy-stun: 60.0

downed-and-revive:
  # Tiempo máximo (segundos) que un jugador permanece abatido antes de morir
  bleedout-seconds: 30
  # Segundos que un compañero debe mantener agachado/clic derecho cerca para revivir
  revive-channel-seconds: 3.0
  # Radio máximo en bloques para poder revivir a un compañero
  revive-radius-blocks: 3.5
  # Porcentaje de vida máxima con el que se levanta el jugador revivido (0.40 = 40%)
  revive-health-ratio: 0.40
